<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Verificación · Backoffice Guilda Work</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='backoffice.css') }}">
  <script src="{{ url_for('static', filename='tema.js') }}"></script>
</head>
<body class="pagina-login">
  <main class="login-caja">
    <div class="marca marca-grande"><span class="marca-logo">GUILDA</span><span class="marca-sub">backoffice</span></div>
    <h1>Verificación en dos pasos</h1>
    <p class="muted">Escribe el código de 6 dígitos de tu app de autenticación, o uno de tus códigos de recuperación.</p>
    {% if error %}<p class="aviso aviso-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" autocomplete="off">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label>Código
        <input type="text" name="codigo" inputmode="numeric" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" maxlength="12" required autofocus>
      </label>
      <button type="submit" class="boton boton-primario boton-ancho">Verificar</button>
    </form>
    <p class="muted"><a href="{{ url_for('rutas.login') }}">Volver al acceso</a></p>
  </main>
  <script src="{{ url_for('static', filename='backoffice.js') }}"></script>
</body>
</html>
