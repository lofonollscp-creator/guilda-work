# Instancia de ENSAYO de PostgreSQL + Citus (un solo nodo) para la migración desde
# SQLite. Es independiente de todo lo demás: proyecto, red y volumen propios, puerto
# solo en 127.0.0.1 y sin datos reales. Se maneja con scripts/pg_ensayo.sh.
#
# La contraseña por defecto es de ensayo: antes de cargar una COPIA de producción
# (fase 8) hay que fijar PG_ENSAYO_PASSWORD con un valor fuerte.
name: guilda-pg-ensayo
services:
  citus:
    build: ./deploy/postgres-citus
    image: guilda-work-citus:ensayo
    container_name: guilda-pg-ensayo
    restart: "no"
    environment:
      POSTGRES_USER: guilda
      POSTGRES_PASSWORD: ${PG_ENSAYO_PASSWORD:-ensayo}
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=citus,pg_stat_statements
      - -c
      - wal_level=logical
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=100
      - -c
      - citus.shard_count=32
    ports:
      - "127.0.0.1:55432:5432"
    shm_size: 256mb
    mem_limit: 1536m
    volumes:
      - citus-ensayo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guilda -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  citus-ensayo:
