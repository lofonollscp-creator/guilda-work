# Configuración de Ory Hydra para Guilda Work (Fase 7b — SSO para
# herramientas externas como Outline que no tienen login con contraseña
# propio). El "login/consent" NO es la UI de referencia de Ory: Hydra
# llama a app/rutas_hydra.py (prefijo /hydra en Guilda Work), que decide
# quién es el usuario apoyándose en la sesión de Kratos que ya exista
# (Fase 7a) — ver deploy/kratos/kratos.yml, selfservice.allowed_return_urls.
#
# dsn y secrets.system se pasan por variable de entorno (ver
# docker-compose.yml), nunca en claro aquí. Los valores de abajo
# (127.0.0.1) son el respaldo para desarrollo local — en el VPS real
# (Fase 3c de HOSTING.md), docker-compose.yml sobreescribe serve.public.*
# y urls.* con la convención de variables de entorno de Ory
# (SERVE_PUBLIC_BASE_URL, URLS_SELF_ISSUER, URLS_LOGIN, ...) — NO hay
# sustitución de plantilla ${VAR} dentro de este archivo. A diferencia de
# Kratos, el navegador SÍ habla directo con la API pública de Hydra
# (Outline le redirige ahí durante el OAuth2) — por eso su base_url tiene
# que ser una URL de verdad alcanzable desde fuera en despliegue real, no
# un respaldo en 127.0.0.1 como serve.admin.base_url (esa sí se queda
# fija, nunca debe ser pública).
dsn: ${DSN}

serve:
  public:
    base_url: http://127.0.0.1:4444/
    cors:
      enabled: true
      allowed_origins:
        - http://127.0.0.1:8000
        - http://localhost:8000
      allowed_methods:
        - GET
        - POST
      allow_credentials: true
  admin:
    base_url: http://127.0.0.1:4445/

urls:
  self:
    issuer: http://127.0.0.1:4444/
  login: http://127.0.0.1:8000/hydra/login
  consent: http://127.0.0.1:8000/hydra/consent
  logout: http://127.0.0.1:8000/hydra/logout

secrets:
  system:
    - ${SECRETS_SYSTEM}

strategies:
  # El access token no necesita ser JWT para este uso (SSO interno, sin
  # microservicios de terceros que lo validen sin llamar a Hydra) — el
  # id_token sí es JWT siempre, por exigencia de la spec OIDC.
  access_token: opaque

oidc:
  subject_identifiers:
    supported_types:
      - public
  # Registro Dinámico de Cliente (RFC7591), desactivado por defecto en
  # Hydra — lo exige ChatGPT para darse de alta solo como cliente OAuth2
  # del servidor MCP remoto (Fase MCP, ver mcp_server_remoto.py y
  # HOSTING.md). A diferencia del resto de clientes de este Hydra
  # (Outline/Element/EspoCRM/Nextcloud, dados de alta a mano con
  # scripts/registrar_cliente_hydra.py), ChatGPT se registra solo la
  # primera vez que se conecta — no hace falta ningún paso manual para
  # él en concreto.
  dynamic_client_registration:
    enabled: true

log:
  level: info
  format: text
