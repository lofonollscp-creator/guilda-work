# Servicios auxiliares de Guilda Work (ninguno reemplaza a serve.py/GuildaWork.exe
# — la app en sí sigue corriendo tal cual, fuera de Docker, ver HOSTING.md).
# Se levantan aparte, apuntando al mismo data/registro.db, sin tocar nada de app/.
#
# Uso local (verificación en este PC):   docker compose up -d
# Uso en el VPS (Fase 3c de HOSTING.md): mismo comando, tras clonar el repo allí,
# con KRATOS_UI_ORIGIN/HYDRA_PUBLIC_ORIGIN/GUILDA_ORIGIN/OUTLINE_PUBLIC_ORIGIN
# fijados en .env a las URLs públicas reales (ver HOSTING.md, sección Docker).
#
# Todos los `ports:` de aquí abajo se publican en 127.0.0.1, NUNCA en
# 0.0.0.0 — Docker manipula iptables directamente para publicar puertos y
# eso SALTA POR ENCIMA de ufw (un `ufw deny 4444` no basta para bloquear un
# puerto publicado por Docker sin este `127.0.0.1:` explícito). En el VPS,
# Caddy corre en el host (fuera de Docker) y sí puede alcanzar localhost
# para hacer de proxy inverso con HTTPS — nada de esto queda expuesto
# directamente a internet.
#
# Dos excepciones intencionadas a "NUNCA en 0.0.0.0", ninguna un
# descuido: `caddy-lan` (perfil `lan`, ver HTTPS_LAN.md, solo pensado
# para la red local de casa) y `openvpn` más abajo (su
# puerto 1194/UDP es la propia puerta de entrada de red — Caddy no
# puede hacerle de proxy, no es HTTP, así que no hay otra capa delante
# que lo filtre; mismo criterio ya aceptado para el puerto 22/SSH vía
# `ufw allow OpenSSH`, ver HOSTING.md sección 1).
#
# Metabase (Fase "integraciones de código abierto" del plan): panel de análisis
# sobre data/registro.db. El driver de SQLite viene ya incluido en la imagen
# oficial de Metabase — no hace falta ningún plugin aparte.
#
# Se monta la CARPETA data/ completa (no solo el .db) porque la app usa WAL
# mode (PRAGMA journal_mode=WAL, Fase 3a) — SQLite necesita poder ver/crear
# los archivos -wal/-shm que viven junto al .db para abrir la conexión, algo
# que un mount de un único archivo no permite. En la práctica, Metabase solo
# hace SELECT (nunca hay ninguna escritura real desde la UI de análisis), así
# que no hace falta forzar :ro para estar a salvo del "usuario que se despista
# y edita algo" — no hay ninguna vía en la interfaz de Metabase para editar
# filas. Si se quisiera un aislamiento estricto a nivel de sistema de
# archivos, la alternativa es apuntar Metabase a una copia periódica del .db
# en vez de al archivo en vivo (ver plan: "vía de escape con pgloader/Postgres").
services:
  metabase:
    image: metabase/metabase:latest
    container_name: guilda-work-metabase
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db

  # MinIO: almacenamiento de objetos compatible con S3, 100% self-hosted.
  # Uso previsto (plan "integraciones de código abierto"): destino de las
  # copias de Litestream (ver litestream.yml), sin depender de un bucket de
  # pago (AWS/Backblaze). El bucket en sí (guilda-backups) se crea aparte,
  # a mano o con `mc`, no en este compose — ver deploy/ para el paso a paso.
  minio:
    image: minio/minio:latest
    container_name: guilda-work-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"   # API S3
      - "127.0.0.1:9001:9001"   # Consola web
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: guilda_admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CambiaEstaClave2026}

  # n8n: automatización de flujos sobre la API REST ya existente
  # (app/rutas_api.py, Fase 2) — n8n es, para Guilda Work, "otro cliente
  # autenticado más", igual que la app móvil: llama a /api/v1/... con un
  # token, sin que haga falta ningún cambio de backend.
  #
  # host.docker.internal apunta al PC anfitrión (donde corre serve.py o
  # GuildaWork.exe fuera de Docker, ver HOSTING.md) — así los flujos de
  # n8n pueden llamar a http://host.docker.internal:8000/api/v1/... para
  # probar contra la app real en local. En el VPS, serve.py corre en la
  # misma máquina que Docker, así que ahí también aplica host.docker.internal
  # (o localhost si se prefiere red "host").
  n8n:
    image: n8nio/n8n:latest
    container_name: guilda-work-n8n
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n

  # Ory Kratos: identidad real para el modo hospedado de Guilda Work
  # (Fase 7a del plan) — sustituye la comprobación de contraseña casera
  # como origen de verdad, sin tocar cli.py/mcp_server.py (usuario local,
  # nunca pasa por aquí) ni el modo escritorio (GuildaWork.exe).
  postgres-kratos:
    image: postgres:16-alpine
    container_name: guilda-work-postgres-kratos
    restart: unless-stopped
    environment:
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: ${KRATOS_DB_PASSWORD:-CambiaEstaClaveKratos2026}
      POSTGRES_DB: kratos
    volumes:
      - postgres-kratos-data:/var/lib/postgresql/data

  kratos-migrate:
    image: oryd/kratos:latest
    container_name: guilda-work-kratos-migrate
    depends_on:
      - postgres-kratos
    environment:
      DSN: postgres://kratos:${KRATOS_DB_PASSWORD:-CambiaEstaClaveKratos2026}@postgres-kratos:5432/kratos?sslmode=disable
    volumes:
      - ./deploy/kratos:/etc/config/kratos:ro
    command: migrate sql -e --yes --config /etc/config/kratos/kratos.yml
    restart: on-failure

  kratos:
    image: oryd/kratos:latest
    container_name: guilda-work-kratos
    restart: unless-stopped
    depends_on:
      - kratos-migrate
    environment:
      DSN: postgres://kratos:${KRATOS_DB_PASSWORD:-CambiaEstaClaveKratos2026}@postgres-kratos:5432/kratos?sslmode=disable
      # Estas dos son sobre Kratos mismo: se quedan en 127.0.0.1 siempre —
      # solo las usa serve.py, en la misma máquina, y sus URLs se
      # reescriben a rutas relativas /.ory/... antes de llegar al
      # navegador (ver app/kratos.py). Nunca deben ser la URL pública.
      SERVE_PUBLIC_BASE_URL: http://127.0.0.1:4433/
      SERVE_ADMIN_BASE_URL: http://127.0.0.1:4434/
      # Estas SÍ son URLs que ve el navegador — origen público de la
      # propia Guilda Work (GUILDA_ORIGIN, definido en .env en el VPS
      # real; por defecto http://127.0.0.1:8000 en local). Cada variable
      # sobreescribe una clave de deploy/kratos/kratos.yml siguiendo la
      # convención de Ory (SCREAMING_SNAKE del camino en el YAML) — Kratos
      # NO hace sustitución de plantilla ${VAR} dentro del archivo, cada
      # env var reemplaza la clave entera.
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: ${GUILDA_ORIGIN:-http://127.0.0.1:8000}/
      SELFSERVICE_ALLOWED_RETURN_URLS: '["${GUILDA_ORIGIN:-http://127.0.0.1:8000}/","${GUILDA_ORIGIN:-http://127.0.0.1:8000}/hydra/login"]'
      SELFSERVICE_FLOWS_LOGIN_UI_URL: ${GUILDA_ORIGIN:-http://127.0.0.1:8000}/login
      SELFSERVICE_FLOWS_REGISTRATION_UI_URL: ${GUILDA_ORIGIN:-http://127.0.0.1:8000}/registro
      SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL: ${GUILDA_ORIGIN:-http://127.0.0.1:8000}/login
      SELFSERVICE_FLOWS_SETTINGS_UI_URL: ${GUILDA_ORIGIN:-http://127.0.0.1:8000}/ajustes-cuenta
      SELFSERVICE_FLOWS_ERROR_UI_URL: ${GUILDA_ORIGIN:-http://127.0.0.1:8000}/login
      SERVE_PUBLIC_CORS_ALLOWED_ORIGINS: '["${GUILDA_ORIGIN:-http://127.0.0.1:8000}"]'
    ports:
      - "127.0.0.1:4433:4433"   # API pública (self-service)
      - "127.0.0.1:4434:4434"   # API admin (gestión de identidades)
    volumes:
      - ./deploy/kratos:/etc/config/kratos:ro
    command: serve --config /etc/config/kratos/kratos.yml --dev

  # Ory Hydra: proveedor OAuth2/OIDC (Fase 7b) — necesario porque Outline
  # (y más adelante OpenProject) no tienen login con contraseña propio,
  # solo saben delegar en un proveedor externo. El "login/consent" lo
  # resuelve app/rutas_hydra.py (prefijo /hydra) apoyándose en la sesión
  # de Kratos que ya exista (Fase 7a) — ver deploy/hydra/hydra.yml.
  postgres-hydra:
    image: postgres:16-alpine
    container_name: guilda-work-postgres-hydra
    restart: unless-stopped
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: ${HYDRA_DB_PASSWORD:-CambiaEstaClaveHydra2026}
      POSTGRES_DB: hydra
    volumes:
      - postgres-hydra-data:/var/lib/postgresql/data

  hydra-migrate:
    image: oryd/hydra:latest
    container_name: guilda-work-hydra-migrate
    depends_on:
      - postgres-hydra
    environment:
      DSN: postgres://hydra:${HYDRA_DB_PASSWORD:-CambiaEstaClaveHydra2026}@postgres-hydra:5432/hydra?sslmode=disable
    volumes:
      - ./deploy/hydra:/etc/config/hydra:ro
    command: migrate sql -e --yes --config /etc/config/hydra/hydra.yml
    restart: on-failure

  hydra:
    image: oryd/hydra:latest
    container_name: guilda-work-hydra
    restart: unless-stopped
    depends_on:
      - hydra-migrate
    environment:
      DSN: postgres://hydra:${HYDRA_DB_PASSWORD:-CambiaEstaClaveHydra2026}@postgres-hydra:5432/hydra?sslmode=disable
      SECRETS_SYSTEM: ${HYDRA_SYSTEM_SECRET:-CambiaEsteSecretoHydra2026CambiaEsteSecretoHydra2026}
      # A diferencia de Kratos, el navegador SÍ habla directo con la API
      # pública de Hydra (Outline le redirige ahí durante el OAuth2) — por
      # eso SERVE_PUBLIC_BASE_URL/URLS_SELF_ISSUER tienen que ser una URL
      # de verdad alcanzable desde fuera en despliegue real
      # (https://hydra.tu-hostname en el VPS, var HYDRA_PUBLIC_ORIGIN), a
      # diferencia del caso de Kratos (que se queda en 127.0.0.1, ver
      # servicio `kratos` más arriba). URLS_LOGIN/CONSENT/LOGOUT son
      # rutas del propio puente de Guilda Work (app/rutas_hydra.py), así
      # que usan GUILDA_ORIGIN en vez de HYDRA_PUBLIC_ORIGIN. Misma
      # convención de Ory que en el servicio `kratos`: cada env var
      # sobreescribe una clave de deploy/hydra/hydra.yml, sin sustitución
      # de plantilla dentro del archivo.
      SERVE_PUBLIC_BASE_URL: ${HYDRA_PUBLIC_ORIGIN:-http://127.0.0.1:4444}/
      SERVE_PUBLIC_CORS_ALLOWED_ORIGINS: '["${GUILDA_ORIGIN:-http://127.0.0.1:8000}"]'
      URLS_SELF_ISSUER: ${HYDRA_PUBLIC_ORIGIN:-http://127.0.0.1:4444}/
      URLS_LOGIN: ${GUILDA_ORIGIN:-http://127.0.0.1:8000}/hydra/login
      URLS_CONSENT: ${GUILDA_ORIGIN:-http://127.0.0.1:8000}/hydra/consent
      URLS_LOGOUT: ${GUILDA_ORIGIN:-http://127.0.0.1:8000}/hydra/logout
      # Sin esto, Hydra ve la conexión que le llega de Caddy como "http"
      # (Caddy termina TLS y le reenvía en plano, igual que a cualquier
      # otro servicio de este stack) — en modo `--dev`, eso hace que sus
      # cookies de login/consent (`ory_hydra_login_csrf_...`) lleven
      # `SameSite=None` (las necesita para sobrevivir la ida y vuelta
      # entre dominios del login) pero SIN `Secure`, y Chrome/todos los
      # navegadores modernos RECHAZAN EN SILENCIO cualquier cookie
      # SameSite=None sin Secure — nunca llega a guardarse, y el login
      # falla con "request_forbidden ... No CSRF value available in the
      # session cookie" (encontrado depurando la Fase 8 en local, pero
      # afecta exactamente igual al VPS — Caddy hace ahí lo mismo).
      # `serve.cookies.secure` fuerza el flag Secure independientemente
      # de lo que Hydra perciba — seguro fijarlo siempre a "true" porque
      # el puerto de Hydra nunca se publica en 0.0.0.0 (ver cabecera del
      # archivo), así que un cliente sin HTTPS real jamás llega hasta él.
      SERVE_COOKIES_SECURE: "true"
    ports:
      - "127.0.0.1:4444:4444"   # API pública (OAuth2/OIDC) — Caddy la publica de verdad
      - "127.0.0.1:4445:4445"   # API admin (login/consent, gestión de clientes) — nunca pública
    volumes:
      - ./deploy/hydra:/etc/config/hydra:ro
    command: serve --config /etc/config/hydra/hydra.yml all --dev

  # Outline: wiki/base de conocimiento para guías de empleados (Fase 7b).
  # No tiene login con contraseña propio — exige un proveedor OIDC externo
  # desde el primer inicio de sesión, de ahí Hydra por encima. Los
  # adjuntos van al MinIO ya desplegado (bucket outline-uploads, se crea
  # aparte con `mc mb`, igual que guilda-backups — ver HOSTING.md).
  postgres-outline:
    image: postgres:16-alpine
    container_name: guilda-work-postgres-outline
    restart: unless-stopped
    environment:
      POSTGRES_USER: outline
      POSTGRES_PASSWORD: ${OUTLINE_DB_PASSWORD:-CambiaEstaClaveOutline2026}
      POSTGRES_DB: outline
    volumes:
      - postgres-outline-data:/var/lib/postgresql/data

  redis-outline:
    image: redis:7-alpine
    container_name: guilda-work-redis-outline
    restart: unless-stopped
    volumes:
      - redis-outline-data:/data

  outline:
    image: outlinewiki/outline:latest
    container_name: guilda-work-outline
    restart: unless-stopped
    depends_on:
      - postgres-outline
      - redis-outline
    ports:
      - "127.0.0.1:3001:3000"   # 3000 ya lo usa Metabase
    environment:
      # Outline exige NODE_ENV=production para servir cookies `secure`, lo
      # que a su vez exige que el navegador vea HTTPS de verdad (propio o
      # de un proxy TLS delante, ver HOSTING.md Fase 3c) — sin eso, el
      # flujo OAuth2 falla con "Cannot send secure cookie over unencrypted
      # connection". En local (sin proxy TLS) usa NODE_ENV=development
      # para poder verificar el flujo entero por http://127.0.0.1:3001 —
      # OJO: en ese modo la interfaz no renderiza (la imagen de producción
      # no trae el código fuente que pediría el servidor de desarrollo de
      # Vite), solo sirve para inspeccionar peticiones/errores por curl.
      NODE_ENV: ${OUTLINE_NODE_ENV:-production}
      SECRET_KEY: ${OUTLINE_SECRET_KEY:?define OUTLINE_SECRET_KEY (openssl rand -hex 32)}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET:?define OUTLINE_UTILS_SECRET (openssl rand -hex 32)}
      DATABASE_URL: postgres://outline:${OUTLINE_DB_PASSWORD:-CambiaEstaClaveOutline2026}@postgres-outline:5432/outline
      DATABASE_URL_TEST: postgres://outline:${OUTLINE_DB_PASSWORD:-CambiaEstaClaveOutline2026}@postgres-outline:5432/outline-test
      PGSSLMODE: disable
      REDIS_URL: redis://redis-outline:6379
      # URL pública de verdad (https://outline.tu-hostname en el VPS) — la
      # necesita para construir enlaces/cookies correctos. FORCE_HTTPS a
      # "true" en despliegue real: Caddy delante SÍ da HTTPS de verdad al
      # navegador, así que la cookie `secure` que exige NODE_ENV=production
      # funciona sin problema (a diferencia de la verificación local por
      # http:// sin proxy, donde tuvo que probarse en development).
      URL: ${OUTLINE_PUBLIC_ORIGIN:-http://127.0.0.1:3001}
      PORT: 3000
      FORCE_HTTPS: ${OUTLINE_FORCE_HTTPS:-false}
      # MinIO ya desplegado (integración anterior) — endpoint interno
      # (contenedor a contenedor) para las subidas, endpoint público para
      # las URLs que ve el navegador (mismo matiz que Kratos, ver app/kratos.py).
      AWS_ACCESS_KEY_ID: guilda_admin
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-CambiaEstaClave2026}
      AWS_REGION: us-east-1
      AWS_S3_UPLOAD_BUCKET_URL: http://minio:9000
      AWS_S3_UPLOAD_BUCKET_NAME: outline-uploads
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_S3_ACL: private
      # Se sirve tal cual (sin proxy) — el navegador pide las imágenes
      # directo a MinIO en su puerto público.
      AWS_S3_UPLOAD_MAX_SIZE: "26214400"
      # Ory Hydra ya desplegado (Fase 7b) — único proveedor OIDC de Outline.
      # AUTH_URI la ve el navegador (pública); TOKEN/USERINFO los llama
      # Outline server-to-server, dentro de la red de Docker (hostname
      # interno, a diferencia de serve.py que corre fuera).
      OIDC_CLIENT_ID: ${OUTLINE_OIDC_CLIENT_ID:?define tras ejecutar scripts/registrar_cliente_hydra.py}
      OIDC_CLIENT_SECRET: ${OUTLINE_OIDC_CLIENT_SECRET:?define tras ejecutar scripts/registrar_cliente_hydra.py}
      OIDC_AUTH_URI: ${HYDRA_PUBLIC_ORIGIN:-http://127.0.0.1:4444}/oauth2/auth
      OIDC_TOKEN_URI: http://hydra:4444/oauth2/token
      OIDC_USERINFO_URI: http://hydra:4444/userinfo
      OIDC_USERNAME_CLAIM: email
      OIDC_DISPLAY_NAME: "Guilda Work"
      OIDC_SCOPES: "openid email profile"

  # Element + Synapse: chat de verdad (Fase 7d) — sustituye a la idea de
  # un chat propio dentro de Guilda Work, decisión explícita del usuario
  # una vez Kratos/Hydra ya estaban desplegados. Sin federación (ver
  # deploy/synapse/guilda-overrides.yaml) — el chat es solo para el
  # equipo de Guilda Work, no para interoperar con otros servidores
  # Matrix. Login solo vía Ory Hydra, igual que Outline.
  postgres-synapse:
    image: postgres:16-alpine
    container_name: guilda-work-postgres-synapse
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${SYNAPSE_DB_PASSWORD:-CambiaEstaClaveSynapse2026}
      POSTGRES_DB: synapse
      # Synapse recomienda collation C + encoding UTF8 — además, la
      # imagen alpine de Postgres solo soporta bien la locale C de
      # todas formas (musl libc, sin locales completas), así que fijarlo
      # explícito no cambia nada respecto al comportamiento por defecto,
      # solo lo deja documentado.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-synapse-data:/var/lib/postgresql/data

  # Genera /data/homeserver.yaml a partir de las variables de entorno la
  # primera vez (mismo patrón que kratos-migrate/hydra-migrate) — esta
  # versión de la imagen de Synapse YA NO genera la config sola al
  # arrancar en modo `run`, hace falta este paso `migrate_config`
  # explícito antes. Termina y no vuelve a hacer nada en arranques
  # posteriores (el archivo ya existe en el volumen persistente).
  synapse-migrate-config:
    image: matrixdotorg/synapse:latest
    container_name: guilda-work-synapse-migrate-config
    depends_on:
      - postgres-synapse
    environment:
      SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME:-chat.localhost}
      SYNAPSE_REPORT_STATS: "no"
      # Sin TLS dentro del propio Synapse — en el VPS real, Caddy hace de
      # proxy TLS delante (igual que con serve.py), no hace falta que
      # Synapse gestione certificados propios.
      SYNAPSE_NO_TLS: "true"
      POSTGRES_HOST: postgres-synapse
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${SYNAPSE_DB_PASSWORD:-CambiaEstaClaveSynapse2026}
    volumes:
      - synapse-data:/data
    command: ["migrate_config"]
    restart: "no"

  synapse:
    image: matrixdotorg/synapse:latest
    container_name: guilda-work-synapse
    restart: unless-stopped
    depends_on:
      - synapse-migrate-config
    ports:
      - "127.0.0.1:8008:8008"
    volumes:
      - synapse-data:/data
      - ./deploy/synapse:/etc/synapse-overrides:ro
    command: ["run", "-c", "/data/homeserver.yaml", "-c", "/etc/synapse-overrides/guilda-overrides.yaml"]

  element-web:
    image: vectorim/element-web:latest
    container_name: guilda-work-element-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8009:80"
    volumes:
      - ./deploy/synapse/element-config.json:/app/config.json:ro

  # OpenProject: gestión de proyectos/tareas de equipo (Fase 7f) — lo que
  # Tareas Outlook no pretende ser (asignación a varias personas, flujos
  # de estado, vistas Kanban/Gantt). Sin SSO: confirmado en su
  # documentación oficial que el login OIDC/SAML es un Enterprise add-on
  # de pago, no está en la edición community que se despliega aquí —
  # login aparte en el dashboard (app/herramientas.py), como
  # Metabase/n8n.
  postgres-openproject:
    image: postgres:16-alpine
    container_name: guilda-work-postgres-openproject
    restart: unless-stopped
    environment:
      POSTGRES_USER: openproject
      POSTGRES_PASSWORD: ${OPENPROJECT_DB_PASSWORD:-CambiaEstaClaveOpenProject2026}
      POSTGRES_DB: openproject
    volumes:
      - postgres-openproject-data:/var/lib/postgresql/data

  memcached-openproject:
    image: memcached:alpine
    container_name: guilda-work-memcached-openproject
    restart: unless-stopped

  # Corre una vez (crea el esquema y el usuario administrador inicial vía
  # OPENPROJECT_SEED_ADMIN_USER_*) y termina — mismo patrón que
  # kratos-migrate/hydra-migrate/synapse-migrate-config.
  openproject-seeder:
    image: openproject/openproject:${OPENPROJECT_TAG:-15-slim}
    container_name: guilda-work-openproject-seeder
    restart: on-failure
    depends_on:
      - postgres-openproject
      - memcached-openproject
    environment: &openproject-env
      DATABASE_URL: postgres://openproject:${OPENPROJECT_DB_PASSWORD:-CambiaEstaClaveOpenProject2026}@postgres-openproject/openproject
      OPENPROJECT_CACHE__MEMCACHE__SERVER: memcached-openproject:11211
      SECRET_KEY_BASE: ${OPENPROJECT_SECRET_KEY_BASE:?define OPENPROJECT_SECRET_KEY_BASE (openssl rand -hex 64)}
      OPENPROJECT_HTTPS: ${OPENPROJECT_HTTPS:-false}
      OPENPROJECT_HOST__NAME: ${OPENPROJECT_HOST_NAME:-127.0.0.1:8010}
      OPENPROJECT_SEED_ADMIN_USER_PASSWORD: ${OPENPROJECT_SEED_ADMIN_USER_PASSWORD:?define OPENPROJECT_SEED_ADMIN_USER_PASSWORD (min. 10 caracteres)}
      OPENPROJECT_SEED_ADMIN_USER_MAIL: ${OPENPROJECT_SEED_ADMIN_USER_MAIL:-admin@guilda.local}
    command: ["./docker/prod/seeder"]

  openproject-web:
    image: openproject/openproject:${OPENPROJECT_TAG:-15-slim}
    container_name: guilda-work-openproject-web
    restart: unless-stopped
    depends_on:
      - openproject-seeder
    environment: *openproject-env
    ports:
      - "127.0.0.1:8010:8080"
    volumes:
      - openproject-data:/var/openproject/assets
    command: ["./docker/prod/web"]

  openproject-worker:
    image: openproject/openproject:${OPENPROJECT_TAG:-15-slim}
    container_name: guilda-work-openproject-worker
    restart: unless-stopped
    depends_on:
      - openproject-seeder
    environment: *openproject-env
    volumes:
      - openproject-data:/var/openproject/assets
    command: ["./docker/prod/worker"]

  openproject-cron:
    image: openproject/openproject:${OPENPROJECT_TAG:-15-slim}
    container_name: guilda-work-openproject-cron
    restart: unless-stopped
    depends_on:
      - openproject-seeder
    environment: *openproject-env
    volumes:
      - openproject-data:/var/openproject/assets
    command: ["./docker/prod/cron"]

  # Chatwoot: bandeja de soporte omnicanal para incidencias de clientes
  # (Fase 7g) — la pieza más cara de operar del catálogo (Rails +
  # Postgres + Redis + Sidekiq). Sin SSO: confirmado en su documentación
  # oficial que SAML/SSO es un plan Enterprise de pago, no está en la
  # community edition — login aparte en el dashboard, como OpenProject.
  postgres-chatwoot:
    # pgvector/pgvector, no el postgres:16-alpine genérico del resto del
    # proyecto — Chatwoot necesita la extensión pgvector para sus
    # funciones de IA (respuestas asistidas), confirmado en su
    # docker-compose.production.yaml oficial.
    image: pgvector/pgvector:pg16
    container_name: guilda-work-postgres-chatwoot
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:-CambiaEstaClaveChatwoot2026}
      POSTGRES_DB: chatwoot
    volumes:
      - postgres-chatwoot-data:/var/lib/postgresql/data

  redis-chatwoot:
    image: redis:7-alpine
    container_name: guilda-work-redis-chatwoot
    restart: unless-stopped
    # A diferencia de redis-outline, Chatwoot SÍ exige contraseña en su
    # Redis para arrancar.
    command: ["redis-server", "--requirepass", "${CHATWOOT_REDIS_PASSWORD:-CambiaEstaClaveRedisChatwoot2026}"]
    volumes:
      - redis-chatwoot-data:/data

  # Corre una vez (crea el esquema, `db:chatwoot_prepare`) y termina —
  # mismo patrón que kratos-migrate/openproject-seeder. La documentación
  # oficial de Chatwoot lo describe como un comando manual de un solo
  # uso; aquí se automatiza como init container para seguir el mismo
  # patrón que el resto de este proyecto.
  chatwoot-prepare:
    image: chatwoot/chatwoot:latest
    container_name: guilda-work-chatwoot-prepare
    restart: on-failure
    depends_on:
      - postgres-chatwoot
      - redis-chatwoot
    environment: &chatwoot-env
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:?define CHATWOOT_SECRET_KEY_BASE (openssl rand -hex 64)}
      FRONTEND_URL: ${CHATWOOT_PUBLIC_ORIGIN:-http://127.0.0.1:8011}
      POSTGRES_HOST: postgres-chatwoot
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:-CambiaEstaClaveChatwoot2026}
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://redis-chatwoot:6379
      REDIS_PASSWORD: ${CHATWOOT_REDIS_PASSWORD:-CambiaEstaClaveRedisChatwoot2026}
      # El alta de cuentas nuevas la hace el administrador desde dentro,
      # no un formulario público — mismo criterio que
      # OPENPROJECT_SEED_ADMIN_USER_* (cuenta inicial controlada, no
      # autoregistro abierto).
      ENABLE_ACCOUNT_SIGNUP: "false"
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]

  chatwoot-web:
    image: chatwoot/chatwoot:latest
    container_name: guilda-work-chatwoot-web
    restart: unless-stopped
    depends_on:
      - chatwoot-prepare
    environment: *chatwoot-env
    entrypoint: ["docker/entrypoints/rails.sh"]
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "127.0.0.1:8011:3000"

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:latest
    container_name: guilda-work-chatwoot-sidekiq
    restart: unless-stopped
    depends_on:
      - chatwoot-prepare
    environment: *chatwoot-env
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  # sqlite-web (Fase 7c, extra) — visor genérico de TODA la base de datos
  # SQLite de Guilda Work, para consultas SQL ad-hoc del admin. A propósito
  # NO es el backoffice real (ver /backoffice en la propia app): no
  # distingue tenants ni usuarios, no usa el login de Guilda Work, y ve
  # tablas sensibles (tokens_api, sesiones). Por eso: solo loopback (nunca
  # detrás de Caddy/dominio público), contraseña propia obligatoria, y el
  # volumen montado de solo lectura para no arriesgar corromper el archivo
  # mientras serve.py escribe en él a la vez. Acceso previsto vía túnel SSH
  # (`ssh -L 8012:127.0.0.1:8012 ...`), nunca expuesto tal cual.
  sqlite-web:
    image: ghcr.io/coleifer/sqlite-web:latest
    container_name: guilda-work-sqlite-web
    restart: unless-stopped
    environment:
      SQLITE_WEB_PASSWORD: ${SQLITE_WEB_PASSWORD:?}
    volumes:
      - ./data:/data:ro
    ports:
      - "127.0.0.1:8012:8080"
    # La contraseña la coge de SQLITE_WEB_PASSWORD (arriba) — el flag -P
    # es para pedirla por teclado de forma interactiva, no vale en Docker.
    command: ["sqlite_web", "-H", "0.0.0.0", "-r", "/data/registro.db"]

  # Vaultwarden (servidor Bitwarden-compatible, código abierto) — un solo
  # sitio cifrado para las contraseñas/tokens de todo este stack (Hydra,
  # OpenProject, Chatwoot, MinIO...), en vez de repartidos entre .env y
  # notas sueltas. Sin SSO: la edición gratuita no ofrece OIDC, mismo
  # caso que OpenProject/Chatwoot/Metabase/n8n — login aparte, con la
  # cuenta que se crea en su propio primer arranque.
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: guilda-work-vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: ${VAULTWARDEN_PUBLIC_ORIGIN:-http://127.0.0.1:8013}
      # Token del panel /admin — generado aleatoriamente (nunca una
      # contraseña elegida a mano, ver HOSTING.md 8.16), en texto plano:
      # Vaultwarden también acepta un hash Argon2, pero generarlo exige
      # un prompt interactivo (`vaultwarden hash`) que no tiene sentido
      # aquí — el texto plano solo saca un aviso en el log, sigue siendo
      # un secreto aleatorio fuerte como cualquier otro de este archivo.
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:?define VAULTWARDEN_ADMIN_TOKEN, p.ej. python -c "import secrets; print(secrets.token_urlsafe(48))"}
      # true solo para crear la primera cuenta (ver HOSTING.md 8.16) —
      # ponlo a false en tu .env en cuanto la tengas.
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-true}
    volumes:
      - vaultwarden-data:/data
    ports:
      - "127.0.0.1:8013:80"

  # Uptime Kuma (monitorización, código abierto) — el stack ya son ~10
  # contenedores; esto avisa si alguno se cae. Sin variables de entorno
  # de credenciales: el primer acceso por navegador crea la cuenta admin
  # directamente ahí, no hay nada que generar ni configurar antes.
  # A propósito NO se monta /var/run/docker.sock (daría acceso
  # equivalente a root sobre el host) — los monitores se añaden a mano
  # desde su propia UI, apuntando a cada servicio por su nombre interno
  # de Docker (misma red que el resto de este archivo, ver HOSTING.md
  # 8.17 para ejemplos concretos).
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: guilda-work-uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "127.0.0.1:8014:3001"

  # EspoCRM (CRM de código abierto) — único CRM libre investigado con
  # OIDC nativo en el core gratuito (AGPL-3.0, desde v7.3), ver
  # HOSTING.md 8.19. Aislamiento entre tenants: el claim `groups` que
  # ahora manda Hydra en el id_token (app/hydra.py) contiene el nombre
  # del tenant, y `oidcTeams` (config manual en EspoCRM, ver HOSTING.md)
  # asocia al usuario solo al Equipo correspondiente en cada login — los
  # Equipos los crea app/espocrm.py al dar de alta un tenant desde el
  # backoffice. Instalación desatendida vía variables ESPOCRM_ADMIN_* —
  # mismo criterio que OPENPROJECT_SEED_ADMIN_USER_* (contraseña inicial
  # obligatoria por variable, no hay asistente interactivo como en
  # Vaultwarden/Uptime Kuma).
  postgres-espocrm:
    image: postgres:16-alpine
    container_name: guilda-work-postgres-espocrm
    restart: unless-stopped
    environment:
      POSTGRES_USER: espocrm
      POSTGRES_PASSWORD: ${ESPOCRM_DB_PASSWORD:-CambiaEstaClaveEspoCRM2026}
      POSTGRES_DB: espocrm
    volumes:
      - postgres-espocrm-data:/var/lib/postgresql/data

  espocrm:
    image: espocrm/espocrm:latest
    container_name: guilda-work-espocrm
    restart: unless-stopped
    depends_on:
      - postgres-espocrm
    environment:
      ESPOCRM_DATABASE_PLATFORM: Postgresql
      ESPOCRM_DATABASE_HOST: postgres-espocrm
      ESPOCRM_DATABASE_USER: espocrm
      ESPOCRM_DATABASE_PASSWORD: ${ESPOCRM_DB_PASSWORD:-CambiaEstaClaveEspoCRM2026}
      ESPOCRM_ADMIN_USERNAME: ${ESPOCRM_ADMIN_USERNAME:-admin}
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD:?define ESPOCRM_ADMIN_PASSWORD (mínimo 8 caracteres)}
      # URL pública de verdad (https://crm.tu-hostname en el VPS) — la
      # necesita para construir enlaces correctos, mismo criterio que
      # OUTLINE_PUBLIC_ORIGIN/CHATWOOT_PUBLIC_ORIGIN.
      ESPOCRM_SITE_URL: ${ESPOCRM_PUBLIC_ORIGIN:-http://127.0.0.1:8015}
    ports:
      - "127.0.0.1:8015:80"
    volumes:
      - espocrm-data:/var/www/html/data

  # Nextcloud (espacio tipo Drive) — mismo criterio de aislamiento por
  # tenant que EspoCRM (ver HOSTING.md 8.20): el claim `groups` que
  # manda Hydra (app/hydra.py) se mapea a Grupos de Nextcloud vía la app
  # oficial `user_oidc`, y app/nextcloud.py crea un Group Folder por
  # tenant al darlo de alta desde el backoffice. El directorio de cada
  # usuario ya es privado por diseño en Nextcloud — el ajuste que de
  # verdad cierra el aislamiento (impedir compartir fuera del propio
  # grupo) es manual, solo desde el panel, ver HOSTING.md.
  #
  # NEXTCLOUD_TRUSTED_DOMAINS es indispensable aquí (a diferencia del
  # resto del stack): Nextcloud rechaza peticiones a un host no listado
  # con un error explícito, no basta con levantar el contenedor.
  postgres-nextcloud:
    image: postgres:16-alpine
    container_name: guilda-work-postgres-nextcloud
    restart: unless-stopped
    environment:
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-CambiaEstaClaveNextcloud2026}
      POSTGRES_DB: nextcloud
    volumes:
      - postgres-nextcloud-data:/var/lib/postgresql/data

  nextcloud:
    image: nextcloud:latest
    container_name: guilda-work-nextcloud
    restart: unless-stopped
    depends_on:
      - postgres-nextcloud
    environment:
      POSTGRES_HOST: postgres-nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-CambiaEstaClaveNextcloud2026}
      POSTGRES_DB: nextcloud
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?define NEXTCLOUD_ADMIN_PASSWORD (mínimo 8 caracteres)}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-127.0.0.1}
    ports:
      - "127.0.0.1:8016:80"
    volumes:
      # Solo mientras no se active MinIO como almacenamiento primario
      # (paso manual `occ` de un solo uso, ver HOSTING.md 8.20) — tras
      # migrar, este volumen deja de crecer con archivos de usuarios,
      # pero se mantiene porque ahí vive la instalación en sí.
      - nextcloud-data:/var/www/html

  # Documenso (firma electrónica) — instancia compartida, como EspoCRM/
  # Nextcloud, pero SIN SSO (confirmado en la documentación oficial:
  # "SSO is only available on the Enterprise plan") y SIN aprovisionamiento
  # por API de Equipos/miembros (verificado en vivo con el spec OpenAPI
  # real del propio contenedor: 89 endpoints, ninguno de Equipos —
  # gestión de Equipos y altas de miembros es 100% manual desde su
  # interfaz web, ver HOSTING.md). El aislamiento entre tenants lo da el
  # token de API que se genera a mano dentro del Equipo de cada uno.
  #
  # NEXT_PRIVATE_ENCRYPTION_KEY/_SECONDARY_KEY: dos claves de cifrado
  # distintas exigidas por la imagen oficial (rotación de claves), no un
  # error de copiar/pegar. NEXT_PRIVATE_SIGNING_PASSPHRASE protege el
  # certificado .p12 (ver HOSTING.md para cómo generar uno autofirmado
  # con openssl si no hay uno de verdad todavía) que Documenso usa para
  # firmar criptográficamente cada PDF completado — sin él, el
  # contenedor ni arranca.
  postgres-documenso:
    image: postgres:16-alpine
    container_name: guilda-work-postgres-documenso
    restart: unless-stopped
    environment:
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: ${DOCUMENSO_DB_PASSWORD:-CambiaEstaClaveDocumenso2026}
      POSTGRES_DB: documenso
    volumes:
      - postgres-documenso-data:/var/lib/postgresql/data

  documenso:
    image: documenso/documenso:latest
    container_name: guilda-work-documenso
    restart: unless-stopped
    depends_on:
      - postgres-documenso
    environment:
      PORT: 3000
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET:?define DOCUMENSO_NEXTAUTH_SECRET (openssl rand -hex 32)}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY:?define DOCUMENSO_ENCRYPTION_KEY (openssl rand -hex 32)}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY:?define DOCUMENSO_ENCRYPTION_SECONDARY_KEY (openssl rand -hex 32)}
      NEXT_PUBLIC_WEBAPP_URL: ${DOCUMENSO_PUBLIC_ORIGIN:-http://127.0.0.1:8018}
      NEXT_PRIVATE_DATABASE_URL: postgres://documenso:${DOCUMENSO_DB_PASSWORD:-CambiaEstaClaveDocumenso2026}@postgres-documenso:5432/documenso
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgres://documenso:${DOCUMENSO_DB_PASSWORD:-CambiaEstaClaveDocumenso2026}@postgres-documenso:5432/documenso
      NEXT_PRIVATE_SMTP_TRANSPORT: ${DOCUMENSO_SMTP_TRANSPORT:-smtp-auth}
      NEXT_PRIVATE_SMTP_HOST: ${DOCUMENSO_SMTP_HOST:?define DOCUMENSO_SMTP_HOST}
      NEXT_PRIVATE_SMTP_PORT: ${DOCUMENSO_SMTP_PORT:-587}
      NEXT_PRIVATE_SMTP_USERNAME: ${DOCUMENSO_SMTP_USERNAME:-}
      NEXT_PRIVATE_SMTP_PASSWORD: ${DOCUMENSO_SMTP_PASSWORD:-}
      NEXT_PRIVATE_SMTP_FROM_NAME: ${DOCUMENSO_SMTP_FROM_NAME:-Guilda Work}
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: ${DOCUMENSO_SMTP_FROM_ADDRESS:?define DOCUMENSO_SMTP_FROM_ADDRESS}
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${DOCUMENSO_SIGNING_PASSPHRASE:?define DOCUMENSO_SIGNING_PASSPHRASE}
    ports:
      - "127.0.0.1:8018:3000"
    volumes:
      - ./deploy/documenso/cert.p12:/opt/documenso/cert.p12:ro

  # Paperless-ngx (gestión documental/OCR) — instancia compartida, con
  # SSO real (a diferencia de Documenso/FacturaScripts): OIDC vía
  # django-allauth desde Paperless-ngx 2.5.0, con sincronización de
  # grupos que reutiliza el mismo claim `groups` que ya manda Hydra
  # desde la Fase CRM (PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS, ver
  # HOSTING.md). Aislamiento entre tenants real y verificado en el
  # propio código fuente (DocumentPermissionsFilter, no una convención
  # de UI, ver app/paperless.py) — y a diferencia de Documenso, el
  # aprovisionamiento (Grupo + usuario de servicio + token) es 100%
  # automático por API, sin ningún paso manual.
  #
  # `paperless-broker`: primer broker Redis-compatible del stack — no
  # hay ninguno reutilizable, Paperless-ngx lo necesita sí o sí para su
  # cola de tareas de consumo/OCR. `PAPERLESS_ADMIN_USER/PASSWORD` crean
  # un superusuario al primer arranque; sus credenciales son las que usa
  # `app/paperless.py` para autenticarse como admin en cada llamada de
  # aprovisionamiento. Gotenberg/Tika (conversión de Office a PDF) quedan
  # fuera del MVP a propósito — no hacen falta para PDFs/imágenes/
  # escaneos, que es el grueso de lo que recibe una gestoría.
  paperless-broker:
    image: redis:7-alpine
    container_name: guilda-work-paperless-broker
    restart: unless-stopped
    volumes:
      - paperless-broker-data:/data

  postgres-paperless:
    image: postgres:16-alpine
    container_name: guilda-work-postgres-paperless
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD:-CambiaEstaClavePaperless2026}
      POSTGRES_DB: paperless
    volumes:
      - postgres-paperless-data:/var/lib/postgresql/data

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: guilda-work-paperless
    restart: unless-stopped
    depends_on:
      - postgres-paperless
      - paperless-broker
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBHOST: postgres-paperless
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:-CambiaEstaClavePaperless2026}
      PAPERLESS_URL: ${PAPERLESS_PUBLIC_ORIGIN:-http://127.0.0.1:8019}
      # Obligatoria — verificado en vivo que sin ella el contenedor no
      # arranca (ImproperlyConfigured: "PAPERLESS_SECRET_KEY is not set
      # or is the default 'change-me' value"), a diferencia de otros
      # servicios del stack donde una clave de sesión por defecto al
      # menos deja arrancar el contenedor.
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?define PAPERLESS_SECRET_KEY (openssl rand -hex 32)}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:?define PAPERLESS_ADMIN_USER}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?define PAPERLESS_ADMIN_PASSWORD, p.ej. openssl rand -hex 16}
      PAPERLESS_OCR_LANGUAGE: spa
      # OIDC vía Hydra (Fase 7b, ya desplegado) — mismo patrón interno/
      # público que Outline/EspoCRM/Nextcloud. `server_url` se resuelve
      # UNA vez, server-to-server, desde dentro del propio contenedor —
      # los endpoints que devuelve el documento de descubrimiento de
      # Hydra (authorization/token/userinfo) son siempre su origen
      # PÚBLICO (config `urls.self.issuer` de Hydra), así que en el VPS
      # real (dominio público, resoluble también desde dentro de Docker)
      # esto funciona sin más — en local sin dominio real, solo con las
      # alias de red de `caddy-local` (ver HTTPS_LOCAL.md), igual que ya
      # hace falta para verificar Outline/Element en local.
      PAPERLESS_ENABLE_ALLAUTH: "true"
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: >-
        {"openid_connect":{"APPS":[{"provider_id":"hydra","name":"Guilda Work","client_id":"${PAPERLESS_OIDC_CLIENT_ID:?define tras ejecutar scripts/registrar_cliente_hydra.py}","secret":"${PAPERLESS_OIDC_CLIENT_SECRET:?define tras ejecutar scripts/registrar_cliente_hydra.py}","settings":{"server_url":"${HYDRA_PUBLIC_ORIGIN:-http://127.0.0.1:4444}","fetch_userinfo":true}}],"SCOPE":["openid","email","profile","groups"]}}
      PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: "true"
      PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
    ports:
      - "127.0.0.1:8019:8000"
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media

  # Baserow (hojas de cálculo tipo base de datos) — instancia compartida.
  # Aislamiento real: el Workspace es el propio contenedor de datos de
  # Baserow (cada base/tabla vive dentro de uno), y un token de base de
  # datos (creado por `app/baserow.py:aprovisionar_tenant()`) queda
  # ligado a un único Workspace — confirmado en el spec OpenAPI real, no
  # solo en la documentación. Sin SSO (confirmado: Enterprise-only,
  # también en self-hosted) — cada persona inicia sesión con su propia
  # cuenta de Baserow.
  #
  # Imagen todo-en-uno (`baserow/baserow`, backend+frontend+workers en
  # un solo contenedor) en vez del `docker-compose.no-caddy.yml`
  # multi-contenedor que ofrece el propio proyecto (8 servicios) — mismo
  # criterio de mínima huella que Documenso/Paperless-ngx.
  # `BASEROW_CADDY_ADDRESSES=:80` desactiva el Caddy interno de la
  # imagen (trae uno propio para HTTPS automático) — sin esto intentaría
  # pedir un certificado Let's Encrypt real para el dominio público y
  # entraría en conflicto con el Caddy propio del stack, que es el que
  # de verdad da el HTTPS aquí. `SECRET_KEY` obligatoria en este modo
  # (misma lección que `PAPERLESS_SECRET_KEY`: verificar en vivo antes
  # de asumir que hay una por defecto segura).
  redis-baserow:
    image: redis:7-alpine
    container_name: guilda-work-redis-baserow
    restart: unless-stopped
    # Obligatorio — verificado en vivo que sin esto los workers de
    # Baserow no pueden conectar ("AUTH <password> called without any
    # password configured for the default user"): la app manda
    # REDIS_PASSWORD siempre, así que el propio Redis tiene que exigirla
    # (mismo patrón ya usado en redis-chatwoot, no en redis-outline).
    command: ["redis-server", "--requirepass", "${BASEROW_REDIS_PASSWORD:-CambiaEstaClaveBaserowRedis2026}"]
    volumes:
      - redis-baserow-data:/data

  postgres-baserow:
    image: postgres:16-alpine
    container_name: guilda-work-postgres-baserow
    restart: unless-stopped
    environment:
      POSTGRES_USER: baserow
      POSTGRES_PASSWORD: ${BASEROW_DB_PASSWORD:-CambiaEstaClaveBaserow2026}
      POSTGRES_DB: baserow
    volumes:
      - postgres-baserow-data:/var/lib/postgresql/data

  baserow:
    image: baserow/baserow:latest
    container_name: guilda-work-baserow
    restart: unless-stopped
    depends_on:
      - postgres-baserow
      - redis-baserow
    environment:
      DATABASE_HOST: postgres-baserow
      DATABASE_NAME: baserow
      DATABASE_USER: baserow
      DATABASE_PASSWORD: ${BASEROW_DB_PASSWORD:-CambiaEstaClaveBaserow2026}
      REDIS_HOST: redis-baserow
      REDIS_PASSWORD: ${BASEROW_REDIS_PASSWORD:-CambiaEstaClaveBaserowRedis2026}
      SECRET_KEY: ${BASEROW_SECRET_KEY:?define BASEROW_SECRET_KEY (openssl rand -hex 32)}
      BASEROW_PUBLIC_URL: ${BASEROW_PUBLIC_ORIGIN:-http://127.0.0.1:8020}
      BASEROW_CADDY_ADDRESSES: ":80"
      EMAIL_SMTP: "True"
      EMAIL_SMTP_HOST: ${BASEROW_SMTP_HOST:?define BASEROW_SMTP_HOST}
      EMAIL_SMTP_PORT: ${BASEROW_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${BASEROW_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${BASEROW_SMTP_PASSWORD:-}
      EMAIL_SMTP_USE_TLS: "True"
      FROM_EMAIL: ${BASEROW_SMTP_FROM_ADDRESS:?define BASEROW_SMTP_FROM_ADDRESS}
    ports:
      - "127.0.0.1:8020:80"
    volumes:
      # Obligatorio — verificado en vivo que sin un volumen montado en
      # /baserow/data el contenedor se niega a arrancar (avisa por log
      # y sale con código 1: "Please run baserow with a mounted data
      # folder... otherwise your data will be lost between runs").
      - baserow-data:/baserow/data

  # FacturaScripts (facturación/contabilidad) — ÚNICA excepción del
  # stack a "un servicio Docker, una instancia": cada tenant necesita su
  # PROPIA instancia física de FacturaScripts (investigado y confirmado
  # que su plugin "MultiEmpresa" no aísla datos entre empresas, solo
  # aplica valores por defecto — con datos económicos de por medio, no
  # es aceptable apoyarse en eso, ver HOSTING.md 8.21). Por eso aquí solo
  # se declara el Postgres COMPARTIDO — los contenedores
  # `guilda-work-facturascripts-tenant-<id>` NO viven en este archivo,
  # los crea `app/facturascripts.py:aprovisionar_tenant()` con
  # `docker run` al dar de alta cada tenant, con su propio rol y base de
  # datos dentro de este mismo Postgres (aislados con
  # `REVOKE CONNECT ... FROM PUBLIC`, no solo por convención).
  postgres-facturascripts:
    image: postgres:16-alpine
    container_name: guilda-work-postgres-facturascripts
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${FACTURASCRIPTS_POSTGRES_ADMIN_PASSWORD:?define FACTURASCRIPTS_POSTGRES_ADMIN_PASSWORD, p.ej. openssl rand -hex 32}
    volumes:
      - postgres-facturascripts-data:/var/lib/postgresql/data

  # Cal.diy (reserva de citas, tipo Cal.com) — a diferencia de
  # FacturaScripts, instancia COMPARTIDA, no una por tenant:
  # `NEXT_PUBLIC_WEBAPP_URL` de Cal.diy es una variable de COMPILACIÓN de
  # Next.js, no de ejecución (confirmado en la documentación oficial de
  # Docker de Cal.diy) — una imagen prehecha no puede servir URLs
  # distintas por contenedor, así que un contenedor físico por tenant no
  # es viable aquí. El aislamiento entre tenants es a nivel de usuario
  # individual de Cal.diy (un usuario de servicio por tenant, ver
  # app/calcom.py), no de instancia física — Cal.com dejó de ser open
  # source en julio 2026, Cal.diy (MIT) es la continuación libre real,
  # sin SSO/Equipos en la edición libre.
  #
  # Sin imagen prehecha publicada (verificado: ni Docker Hub ni el
  # mirror de Scarf mencionado en su propio docker-compose.yml oficial
  # tienen un tag descargable) — se construye desde el propio
  # repositorio (`calcom/cal.diy`, MIT) como contexto de build remoto,
  # así no hace falta vendorizar un monorepo de Next.js dentro de este
  # repositorio. **Nota de honestidad**: este build remoto se diseñó
  # leyendo el `docker-compose.yml`/`.env.example` reales del repositorio
  # (no solo su documentación), pero no se ha podido ejecutar de punta a
  # punta en el entorno de desarrollo de este proyecto — el monorepo es
  # demasiado grande para compilarlo aquí (el simple `git clone` superó
  # los 3 minutos). Compilar tarda bastante (es un monorepo Next.js/
  # Turborepo) — verificar en vivo al desplegar, ver HOSTING.md 8.25.
  redis-calcom:
    image: redis:7-alpine
    container_name: guilda-work-redis-calcom
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${CALCOM_REDIS_PASSWORD:-CambiaEstaClaveCalcomRedis2026}"]
    volumes:
      - redis-calcom-data:/data

  postgres-calcom:
    image: postgres:16-alpine
    container_name: guilda-work-postgres-calcom
    restart: unless-stopped
    environment:
      POSTGRES_USER: calcom
      POSTGRES_PASSWORD: ${CALCOM_DB_PASSWORD:-CambiaEstaClaveCalcom2026}
      POSTGRES_DB: calcom
    volumes:
      - postgres-calcom-data:/var/lib/postgresql/data

  calcom-web:
    container_name: guilda-work-calcom-web
    restart: unless-stopped
    depends_on:
      - postgres-calcom
    build:
      context: https://github.com/calcom/cal.diy.git#main
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* se hornean en el bundle de cliente en tiempo de
        # build — de ahí que CALCOM_PUBLIC_ORIGIN tenga que ser el
        # dominio público REAL antes de construir, no algo que se pueda
        # cambiar luego solo con una variable de entorno de ejecución.
        NEXT_PUBLIC_WEBAPP_URL: ${CALCOM_PUBLIC_ORIGIN:-http://127.0.0.1:8021}
        NEXT_PUBLIC_API_V2_URL: ${CALCOM_API_PUBLIC_ORIGIN:-http://127.0.0.1:8022}/v2
        NEXT_PUBLIC_LICENSE_CONSENT: "true"
        CALCOM_TELEMETRY_DISABLED: "1"
        NEXTAUTH_SECRET: ${CALCOM_NEXTAUTH_SECRET:?define CALCOM_NEXTAUTH_SECRET, p.ej. openssl rand -base64 32}
        CALENDSO_ENCRYPTION_KEY: ${CALCOM_ENCRYPTION_KEY:?define CALCOM_ENCRYPTION_KEY, p.ej. openssl rand -base64 24}
        DATABASE_URL: postgresql://calcom:${CALCOM_DB_PASSWORD:-CambiaEstaClaveCalcom2026}@postgres-calcom:5432/calcom
        DATABASE_DIRECT_URL: postgresql://calcom:${CALCOM_DB_PASSWORD:-CambiaEstaClaveCalcom2026}@postgres-calcom:5432/calcom
    environment:
      DATABASE_URL: postgresql://calcom:${CALCOM_DB_PASSWORD:-CambiaEstaClaveCalcom2026}@postgres-calcom:5432/calcom
      DATABASE_DIRECT_URL: postgresql://calcom:${CALCOM_DB_PASSWORD:-CambiaEstaClaveCalcom2026}@postgres-calcom:5432/calcom
      NEXTAUTH_SECRET: ${CALCOM_NEXTAUTH_SECRET:?define CALCOM_NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${CALCOM_PUBLIC_ORIGIN:-http://127.0.0.1:8021}
    ports:
      - "127.0.0.1:8021:3000"

  calcom-api:
    container_name: guilda-work-calcom-api
    restart: unless-stopped
    depends_on:
      - postgres-calcom
      - redis-calcom
    build:
      context: https://github.com/calcom/cal.diy.git#main
      dockerfile: apps/api/v2/Dockerfile
      args:
        DATABASE_URL: postgresql://calcom:${CALCOM_DB_PASSWORD:-CambiaEstaClaveCalcom2026}@postgres-calcom:5432/calcom
        DATABASE_DIRECT_URL: postgresql://calcom:${CALCOM_DB_PASSWORD:-CambiaEstaClaveCalcom2026}@postgres-calcom:5432/calcom
    environment:
      NODE_ENV: production
      API_PORT: "80"
      DATABASE_URL: postgresql://calcom:${CALCOM_DB_PASSWORD:-CambiaEstaClaveCalcom2026}@postgres-calcom:5432/calcom
      DATABASE_READ_URL: postgresql://calcom:${CALCOM_DB_PASSWORD:-CambiaEstaClaveCalcom2026}@postgres-calcom:5432/calcom
      DATABASE_WRITE_URL: postgresql://calcom:${CALCOM_DB_PASSWORD:-CambiaEstaClaveCalcom2026}@postgres-calcom:5432/calcom
      DATABASE_DIRECT_URL: postgresql://calcom:${CALCOM_DB_PASSWORD:-CambiaEstaClaveCalcom2026}@postgres-calcom:5432/calcom
      NEXTAUTH_SECRET: ${CALCOM_NEXTAUTH_SECRET:?define CALCOM_NEXTAUTH_SECRET}
      JWT_SECRET: ${CALCOM_JWT_SECRET:?define CALCOM_JWT_SECRET, p.ej. openssl rand -base64 32}
      REDIS_URL: redis://:${CALCOM_REDIS_PASSWORD:-CambiaEstaClaveCalcomRedis2026}@redis-calcom:6379
      WEB_APP_URL: ${CALCOM_PUBLIC_ORIGIN:-http://127.0.0.1:8021}
    ports:
      - "127.0.0.1:8022:80"

  # Listmonk (newsletter/envíos masivos) — instancia COMPARTIDA, con
  # aislamiento real por Lista/Rol de lista (verificado en vivo contra
  # un contenedor real, no solo leído en el código fuente — ver
  # app/listmonk.py). 100% declarativo, copiado casi literal del
  # docker-compose.yml oficial del propio proyecto: con
  # LISTMONK_ADMIN_USER/PASSWORD definidas, el propio comando de
  # arranque instala el esquema y crea el superadmin la primera vez, sin
  # ningún script propio (a diferencia de Cal.diy).
  postgres-listmonk:
    image: postgres:17-alpine
    container_name: guilda-work-postgres-listmonk
    restart: unless-stopped
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD:-CambiaEstaClaveListmonk2026}
      POSTGRES_DB: listmonk
    volumes:
      - postgres-listmonk-data:/var/lib/postgresql/data

  listmonk:
    image: listmonk/listmonk:latest
    container_name: guilda-work-listmonk
    restart: unless-stopped
    depends_on:
      - postgres-listmonk
    command: [sh, -c, "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''"]
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD:-CambiaEstaClaveListmonk2026}
      LISTMONK_db__database: listmonk
      LISTMONK_db__host: postgres-listmonk
      LISTMONK_db__port: 5432
      LISTMONK_db__ssl_mode: disable
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER:?define LISTMONK_ADMIN_USER}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD:?define LISTMONK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8023:9000"
    volumes:
      - listmonk-uploads:/listmonk/uploads

  # Stalwart (correo propio, backend alternativo con mejor API JMAP para
  # MCP que el cliente IMAP genérico de app/correo.py, ver
  # app/stalwart.py). Imagen oficial `stalwartlabs/stalwart:latest`, sin
  # licencia Enterprise — verificado en vivo que el aislamiento por
  # Tenant/Domain/Account es real y gratis (ver docstring de
  # app/stalwart.py). Bundlea su propio almacenamiento (RocksDB), no
  # necesita un contenedor de base de datos aparte.
  #
  # EXCEPCIÓN explícita a "todo detrás de Caddy en 443" (mismo criterio
  # ya aceptado para SSH/OpenVPN): los puertos de correo real
  # (SMTP/IMAP/POP3/ManageSieve) no son HTTP, Caddy no puede hacerles de
  # proxy — tienen que publicarse directamente en `0.0.0.0`. Solo el
  # puerto de administración HTTP (8080, usado por app/stalwart.py y por
  # la propia WebUI) va detrás de Caddy, igual que el resto de
  # herramientas — ver HOSTING.md.
  #
  # Bootstrap: a diferencia de Kratos/Hydra/Listmonk, Stalwart NO admite
  # bootstrap 100% por variables de entorno — la primera vez que arranca
  # imprime un admin temporal en `docker logs` y exige completar un
  # asistente de instalación web (`/admin`) una sola vez, tras lo cual
  # hace falta un `docker restart` para que el admin permanente generado
  # quede activo (verificado en vivo). Ver HOSTING.md para el paso a
  # paso — no es un fallo de esta configuración, es cómo funciona
  # Stalwart la primera vez.
  stalwart:
    image: stalwartlabs/stalwart:latest
    container_name: guilda-work-stalwart
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8080"
      - "0.0.0.0:25:25"
      - "0.0.0.0:587:587"
      - "0.0.0.0:465:465"
      - "0.0.0.0:143:143"
      - "0.0.0.0:993:993"
      - "0.0.0.0:110:110"
      - "0.0.0.0:995:995"
      - "0.0.0.0:4190:4190"
    volumes:
      - stalwart-data:/opt/stalwart

  # ntfy (notificaciones push autoalojadas, Apache-2.0/GPLv2 dual) —
  # instancia compartida, aislamiento real por tenant vía usuario+ACL de
  # topic nativos de ntfy (ver app/ntfy.py). Un único binario, sin base
  # de datos aparte (el archivo de usuarios vive en el propio volumen).
  #
  # Bootstrap: NTFY_AUTH_DEFAULT_ACCESS=deny-all para que un topic sin
  # ACL explícita no sea público por defecto (el valor de fábrica de
  # ntfy es "read-write" para cualquiera, pensado para ntfy.sh público,
  # no para un despliegue multi-tenant privado como este) — verificado
  # en vivo que un cliente anónimo recibe 403 al publicar en un topic
  # ajeno con este valor. El alta del usuario admin (necesario para que
  # app/ntfy.py pueda crear usuarios de tenant por API) es un paso manual
  # único, ver HOSTING.md.
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: guilda-work-ntfy
    restart: unless-stopped
    command: serve
    environment:
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_BASE_URL: ${NTFY_PUBLIC_ORIGIN:-http://127.0.0.1:8027}
    ports:
      - "127.0.0.1:8027:80"
    volumes:
      - ntfy-data:/var/lib/ntfy

  # Jitsi Meet (videollamadas autoalojadas, Apache-2.0) — instancia
  # compartida: una videollamada no tiene datos persistentes que aislar
  # por tenant, el aislamiento real es que cada JWT solo es válido para
  # UNA sala concreta (ver app/jitsi.py) — el secreto de firma es
  # compartido, pero no sirve para entrar en la sala de otro tenant sin
  # que Guilda Work te dé un JWT para esa sala en concreto.
  #
  # Autenticación JWT (ENABLE_AUTH/AUTH_TYPE/JWT_APP_ID/JWT_APP_SECRET) —
  # verificado en vivo que es una función gratuita del propio proyecto
  # (sin add-on de pago): el stack de 4 servicios arranca limpio con
  # ella activa (Jicofo se autentica contra Prosody y descubre el JVB
  # con el módulo de auth JWT cargado). Ver el docstring de
  # app/jitsi.py para el detalle de qué SÍ y qué NO se pudo verificar de
  # punta a punta en este entorno de desarrollo.
  #
  # Volúmenes con nombre (no bind mounts) a propósito: el propio
  # despliegue oficial de docker-jitsi-meet exige que las carpetas del
  # host tengan el UID 1000 del contenedor ya aplicado a mano
  # (`chown -R 1000:1000` antes del primer arranque) — un volumen con
  # nombre evita ese paso manual por completo, Docker gestiona los
  # permisos internamente.
  #
  # Puerto UDP del videobridge — EXCEPCIÓN explícita a "todo detrás de
  # Caddy en 443" (mismo criterio ya aceptado para SSH/OpenVPN/correo de
  # Stalwart): el tráfico de medios (RTP/SRTP) no es HTTP.
  jitsi-prosody:
    image: ghcr.io/jitsi/prosody:unstable
    container_name: guilda-work-jitsi-prosody
    restart: unless-stopped
    environment:
      ENABLE_AUTH: "1"
      AUTH_TYPE: jwt
      JWT_APP_ID: ${JITSI_JWT_APP_ID:-guilda_work}
      JWT_APP_SECRET: ${JITSI_JWT_APP_SECRET:?define JITSI_JWT_APP_SECRET, p.ej. openssl rand -base64 32}
      PUBLIC_URL: ${JITSI_PUBLIC_ORIGIN:-http://127.0.0.1:8028}
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      JICOFO_COMPONENT_SECRET: ${JITSI_JICOFO_COMPONENT_SECRET:?define JITSI_JICOFO_COMPONENT_SECRET, p.ej. openssl rand -base64 32}
      JVB_AUTH_PASSWORD: ${JITSI_JVB_AUTH_PASSWORD:?define JITSI_JVB_AUTH_PASSWORD, p.ej. openssl rand -base64 32}
      JICOFO_AUTH_PASSWORD: ${JITSI_JICOFO_AUTH_PASSWORD:?define JITSI_JICOFO_AUTH_PASSWORD, p.ej. openssl rand -base64 32}
    volumes:
      - jitsi-prosody-config:/config
      - jitsi-prosody-plugins:/prosody-plugins-custom
      - jitsi-prosody-storage:/var/lib/prosody

  jitsi-jicofo:
    image: ghcr.io/jitsi/jicofo:unstable
    container_name: guilda-work-jitsi-jicofo
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
    environment:
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_SERVER: jitsi-prosody
      JICOFO_COMPONENT_SECRET: ${JITSI_JICOFO_COMPONENT_SECRET:?define JITSI_JICOFO_COMPONENT_SECRET}
      JICOFO_AUTH_PASSWORD: ${JITSI_JICOFO_AUTH_PASSWORD:?define JITSI_JICOFO_AUTH_PASSWORD}
    volumes:
      - jitsi-jicofo-config:/config

  jitsi-jvb:
    image: ghcr.io/jitsi/jvb:unstable
    container_name: guilda-work-jitsi-jvb
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
    ports:
      - "0.0.0.0:10000:10000/udp"
    environment:
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_SERVER: jitsi-prosody
      JVB_AUTH_PASSWORD: ${JITSI_JVB_AUTH_PASSWORD:?define JITSI_JVB_AUTH_PASSWORD}
      JVB_ADVERTISE_IPS: ${JITSI_JVB_ADVERTISE_IP:-127.0.0.1}
    volumes:
      - jitsi-jvb-config:/config

  jitsi-web:
    image: ghcr.io/jitsi/web:unstable
    container_name: guilda-work-jitsi-web
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
      - jitsi-jicofo
      - jitsi-jvb
    ports:
      - "127.0.0.1:8028:80"
    environment:
      ENABLE_AUTH: "1"
      AUTH_TYPE: jwt
      TOKEN_AUTH_URL: ""
      JWT_APP_ID: ${JITSI_JWT_APP_ID:-guilda_work}
      PUBLIC_URL: ${JITSI_PUBLIC_ORIGIN:-http://127.0.0.1:8028}
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_BOSH_URL_BASE: http://jitsi-prosody:5280
      XMPP_WEBSOCKET_DOMAIN: ${JITSI_PUBLIC_HOSTNAME:-127.0.0.1}
    volumes:
      - jitsi-web-config:/config

  # Meilisearch (buscador unificado, MIT) — instancia compartida, un
  # único índice para notas+tareas+correo con aislamiento real por
  # *tenant token* (JWT firmado con una clave de búsqueda propia, con un
  # filtro `usuario_id = <n>` embebido — ver app/busqueda.py). Verificado
  # en vivo contra un contenedor real que ese filtro es imposible de
  # saltar desde el cliente (se aplica siempre en AND, nunca se
  # sustituye). MIT en vez de Typesense (GPL-3.0, resuelve lo mismo) por
  # ser la opción más consistente con el resto del stack (Documenso/
  # Baserow/Cal.diy/Listmonk también MIT/Apache-2.0).
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: guilda-work-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?define MEILISEARCH_MASTER_KEY, p.ej. openssl rand -base64 32}
      MEILI_ENV: production
    ports:
      - "127.0.0.1:8029:7700"
    volumes:
      - meilisearch-data:/meili_data

  # OpenVPN (acceso VPN al VPS) — imagen `kylemanna/openvpn`, el
  # empaquetado Docker estándar del propio proyecto `openvpn/openvpn`
  # (usa su binario real, con scripts auxiliares para gestionar la PKI
  # sin instalar easy-rsa a mano, ver HOSTING.md 8.18). A diferencia de
  # Kratos/Hydra, este servicio NO se autoconfigura al arrancar — hace
  # falta `ovpn_genconfig`/`ovpn_initpki` una sola vez antes del primer
  # `docker compose up -d openvpn` (ver HOSTING.md 8.18), si no el
  # contenedor no tiene configuración que servir.
  #
  # `cap_add: NET_ADMIN` + `devices: /dev/net/tun`: imprescindibles para
  # que el proceso pueda crear la interfaz de red virtual — sin esto no
  # arranca. Puerto UDP publicado en `0.0.0.0` a propósito (ver la nota
  # de cabecera de este archivo): OpenVPN no es HTTP, Caddy no puede
  # hacerle de proxy, así que la propia VPN es la puerta de entrada de
  # red — mismo criterio ya aceptado para el puerto 22/SSH.
  openvpn:
    image: kylemanna/openvpn:latest
    container_name: guilda-work-openvpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "0.0.0.0:1194:1194/udp"
    volumes:
      - ovpn-data:/etc/openvpn

  # Caddy local (Fase 8) — HTTPS real en desarrollo, para poder terminar
  # de verificar los flujos OIDC (Outline/Element) que en local plano
  # (http://127.0.0.1) se quedan bloqueados en el intercambio de token —
  # ver HTTPS_LOCAL.md. `profiles: ["https-local"]` significa que un
  # `docker compose up -d` normal NUNCA lo arranca — hace falta pedirlo
  # explícito con `--profile https-local`, así el día a día de
  # desarrollo (que no necesita HTTPS) no cambia en nada.
  caddy-local:
    image: caddy:latest
    container_name: guilda-work-caddy-local
    restart: unless-stopped
    profiles: ["https-local"]
    ports:
      # Mismo puerto (8443) a los dos lados a propósito — ver el comentario
      # en deploy/Caddyfile.local sobre por qué el puerto interno también
      # tiene que ser 8443, no 443 (Synapse necesita alcanzar el MISMO
      # "https://hydra.localhost:8443/..." tanto desde el navegador como
      # desde dentro de la red de Docker, para que el `iss` de los tokens
      # de Hydra encaje con el issuer que valida su config OIDC).
      - "127.0.0.1:8443:8443"
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy-local-data:/data
    # Caddy resuelve *.localhost sin salir a internet (es un TLD
    # especial, RFC 6761) — no necesita el puerto 80 para nada aquí
    # porque `tls internal` no pasa por Let's Encrypt.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Alias en la red interna de Docker: así OTROS contenedores (no solo
    # el navegador) pueden resolver *.localhost y llegar aquí — hace
    # falta para Synapse, cuya librería OIDC exige HTTPS de verdad
    # también en sus llamadas servidor-a-servidor (ver HTTPS_LOCAL.md).
    networks:
      default:
        aliases:
          - app.localhost
          - hydra.localhost
          - outline.localhost
          - chat.localhost
          - matrix.localhost

  # Caddy LAN ("opción 1": servidor en la red local, sin exponerlo a
  # internet) — HTTPS real identificando el servidor por su IP en la LAN
  # (ver deploy/Caddyfile.lan) en vez de *.localhost, que solo vale dentro
  # de esta misma máquina. `profiles: ["lan"]`: nunca se arranca con un
  # `docker compose up -d` normal, hace falta pedirlo explícito con
  # `--profile lan`. A diferencia de caddy-local, publica en `0.0.0.0` (no
  # solo 127.0.0.1) para que otros dispositivos de la LAN puedan alcanzarlo
  # más adelante — hoy mismo, verificar solo desde esta máquina es
  # suficiente antes de mover el servidor a otro equipo.
  caddy-lan:
    image: caddy:latest
    container_name: guilda-work-caddy-lan
    restart: unless-stopped
    profiles: ["lan"]
    environment:
      GUILDA_LAN_IP: ${GUILDA_LAN_IP:?define la IP de esta máquina en la LAN, p.ej. 192.168.1.181}
    ports:
      - "0.0.0.0:8443:8443"
      - "0.0.0.0:8444:8444"
      - "0.0.0.0:8445:8445"
      - "0.0.0.0:8446:8446"
      - "0.0.0.0:8447:8447"
    volumes:
      - ./deploy/Caddyfile.lan:/etc/caddy/Caddyfile:ro
      - caddy-lan-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

